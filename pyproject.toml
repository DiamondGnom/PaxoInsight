[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paxoinsight"
version = "6.0.0"
description = "Standalone archive analysis and 7Z preparation application"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Paxo" }]
dependencies = [
    "cryptography==50.0.1",
    "py7zr==1.1.3",
    "rarfile==4.5",
    "tkinterdnd2==0.6.3",
]

[project.scripts]
paxoinsight = "paxoinsight.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
