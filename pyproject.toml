[build-system]
requires = ["setuptools>=84.0.0,<85", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paxoinsight"
version = "6.3"
description = "Standalone archive analysis and 7Z preparation application"
requires-python = ">=3.14.8,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Paxo" }]
dependencies = [
    "cryptography>=50.0.1,<51",
    "defusedxml==0.7.1",
    "py7zr>=1.1.3,<1.2",
    "rarfile==4.5",
]

[project.optional-dependencies]
desktop = ["tkinterdnd2==0.6.4"]

[project.scripts]
paxoinsight = "paxoinsight.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/paxoinsight/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
